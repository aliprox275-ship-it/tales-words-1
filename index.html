    <style>
      :root{
        color-scheme: dark;
        --bg:#070a12; --surface:#0d1424; --surface2:#141f38; --ink:#eaf3fc; --muted:#9db1c9;
        --line:#24365c; --teal:#0891b2; --teal-dark:#22d3ee; --rust:#7c5cd6; --rust-dark:#c4b5fd;
        --ok:#25b47a; --bad:#e5484d; --gold:#7c6cf0;
        --grad:linear-gradient(120deg,#22d3ee 0%,#818cf8 55%,#c084fc 100%);
        --shadow:0 10px 30px rgba(0,0,0,.5);
        --r-card:16px; --r-btn:12px; --pad-card:16px; --bar-h:56px;
        --shadow-card:0 2px 12px rgba(0,0,0,.42);
      }
      *{box-sizing:border-box}
      [hidden]{display:none !important}
      html{scrollbar-gutter:stable}
      body{
        margin:0; background:var(--bg); color:var(--ink);
        font-family:"Rubik",system-ui,sans-serif; line-height:1.7;
        -webkit-font-smoothing:antialiased;
      }
      button{font-family:inherit; cursor:pointer}
      :focus-visible{outline:3px solid var(--gold); outline-offset:2px; border-radius:6px}
      .wrap{max-width:1060px; margin:0 auto; padding:20px 18px 128px}
      .top h1{font-size:clamp(1.7rem,4.5vw,2.5rem); font-weight:800; margin:0 0 8px; line-height:1.35}
      .top h1 .en{color:var(--teal)} .top h1 .de{color:var(--rust)}
      .lede{margin:0 0 18px; color:var(--muted); font-size:1.05rem; max-width:62ch}
      .stats{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px}
      .stat{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 14px; font-weight:500; font-size:.95rem}
      .stat b{font-size:1.15rem; font-weight:800}
      .progress-track{height:10px; background:var(--surface2); border-radius:99px; overflow:hidden; border:1px solid var(--line)}
      .progress-fill{height:100%; width:0%; background:var(--teal); border-radius:99px; transition:width .5s ease}
      .tabs{display:flex; gap:8px; margin:26px 0 18px; flex-wrap:wrap}
      .tab{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:10px 20px; border-radius:99px; font-size:1rem; font-weight:700}
      .tab.active{background:var(--ink); color:var(--bg); border-color:var(--ink)}
      .filters{display:flex; flex-wrap:wrap; gap:14px; align-items:center; margin-bottom:20px}
      .switch{display:inline-flex; background:var(--surface2); border:1px solid var(--line); border-radius:99px; padding:4px; gap:4px}
      .switch button{border:0; background:transparent; color:var(--ink); padding:7px 16px; border-radius:99px; font-weight:700; font-size:.95rem}
      .switch button.active-en{background:var(--teal); color:#fff}
      .switch button.active-de{background:var(--rust); color:#fff}
      .switch button.active-all{background:var(--ink); color:var(--bg)}
      .lvl{display:inline-flex; gap:6px}
      .lvl button{border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:7px 14px; border-radius:99px; font-weight:700; font-size:.9rem}
      .lvl button.active{color:var(--ink); border-color:var(--ink); background:var(--surface2)}
      .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px}
      .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow)}
      .card img{width:100%; aspect-ratio:3/2; object-fit:cover; display:block}
      .card-body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1}
      .card-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
      .badge{font-size:.8rem; font-weight:800; padding:2px 10px; border-radius:99px; color:#fff}
      .badge.en{background:var(--teal)} .badge.de{background:var(--rust)}
      .lvl-tag{font-size:.8rem; font-weight:800; border:1.5px solid currentColor; padding:1px 9px; border-radius:99px}
      .lvl-tag.en{color:var(--teal-dark)} .lvl-tag.de{color:var(--rust-dark)}
      .mins{font-size:.85rem; color:var(--muted)}
      .done-tag{font-size:.85rem; font-weight:800; color:var(--ok)}
      .card h3{margin:2px 0 0; font-size:1.3rem; line-height:1.4}
      .card h3 .foreign{font-family:"Source Serif 4",serif; direction:ltr; unicode-bidi:isolate}
      .card .about{margin:0; color:var(--muted); font-size:.95rem; flex:1}
      .read-btn{margin-top:6px; border:0; border-radius:12px; padding:12px; font-size:1rem; font-weight:800; color:#fff}
      .read-btn.en{background:var(--teal)} .read-btn.de{background:var(--rust)}
      .empty-msg{color:var(--muted); padding:30px 0; text-align:center}
      footer{margin-top:44px; color:var(--muted); font-size:.9rem; border-top:1px solid var(--line); padding-top:16px}
      @media (max-width:560px){ .wrap{padding:16px 14px 118px} .reader-body h2 .foreign{font-size:1.7rem} .tab{padding:9px 15px; font-size:.95rem} }
