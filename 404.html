<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070a12" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png" />
    <title>الصفحة غير موجودة — Tales &amp; Words</title>
    <style>
      :root{--bg:#070a12; --surface:#0d1424; --ink:#eaf3fc; --muted:#9db1c9; --line:#24365c;
        --grad:linear-gradient(120deg,#22d3ee 0%,#818cf8 55%,#c084fc 100%)}
      *{box-sizing:border-box}
      body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
        background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Tahoma,sans-serif; line-height:1.7; text-align:center}
      .card{max-width:420px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px 24px;
        box-shadow:0 10px 30px rgba(0,0,0,.5)}
      img{width:84px; height:84px; border-radius:20px}
      .code{font-size:3.4rem; font-weight:800; line-height:1.1; margin:14px 0 4px; background:var(--grad);
        -webkit-background-clip:text; background-clip:text; color:transparent}
      h1{font-size:1.35rem; margin:0 0 6px}
      p{color:var(--muted); margin:0 0 22px}
      p span{direction:ltr; unicode-bidi:isolate; font-family:Georgia,serif}
      a{display:inline-block; background:var(--grad); color:#fff; text-decoration:none; font-weight:800;
        padding:12px 26px; border-radius:12px}
      a:focus-visible{outline:3px solid #7c6cf0; outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/assets/icons/icon-192.png" alt="Tales &amp; Words" />
      <div class="code">404</div>
      <h1>هذه الصفحة غير موجودة</h1>
      <p>يبدو أن القصة ضاعت في الطريق… <span lang="en">Lost in the story</span> · <span lang="de">Verloren in der Geschichte</span></p>
      <a href="/">↩ العودة إلى الرئيسية</a>
    </main>
  </body>
</html>
